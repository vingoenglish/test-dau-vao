<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra đầu vào – Vingo English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   VINGO ENGLISH – BÀI KIỂM TRA ĐẦU VÀO (GIAO TIẾP)
   Màu thương hiệu: #005BEA (xanh) – #FFBC09 (vàng)
   ====================================================================== */
:root{
  --blue:#005BEA; --blue-d:#0047B8; --blue-50:#EEF4FF; --blue-100:#DCE8FF;
  --yellow:#FFBC09; --yellow-50:#FFF7E0;
  --ink:#0B1B3F; --ink-2:#44506B; --ink-3:#7A859C; --line:#E3E8F2;
  --bg:#F4F7FD; --white:#fff; --green:#14A44D; --red:#E5383B;
  --r:14px; --shadow:0 6px 24px rgba(11,27,63,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand img{height:34px}
.brand .w1{color:var(--blue)} .brand .w2{color:var(--yellow)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.timer{display:flex;align-items:center;gap:8px;background:var(--blue-50);color:var(--blue);font-weight:700;padding:7px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.timer.warn{background:#FFF0F0;color:var(--red)}
.cand{color:var(--ink-2);font-size:14px}

/* ---------- Layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:28px}
.narrow{max-width:720px;margin:0 auto}
h1{font-size:28px;line-height:1.25;margin:0 0 8px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--ink-3)}
.lead{color:var(--ink-2);font-size:17px}
.pill{display:inline-block;background:var(--yellow-50);color:#8A6300;font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-accent{background:var(--yellow);color:var(--ink)}.btn-accent:hover{filter:brightness(.96)}
.btn-ghost{background:var(--white);color:var(--blue);border:1.5px solid var(--blue-100)}.btn-ghost:hover{background:var(--blue-50)}
.btn-danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{padding:15px 28px;font-size:17px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* ---------- Welcome ---------- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.hero-art{background:linear-gradient(135deg,var(--blue) 0%,#2F7BFF 100%);border-radius:var(--r);color:#fff;padding:28px;position:relative;overflow:hidden}
.hero-art:after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:var(--yellow);opacity:.9}
.hero-art .big{font-size:44px;font-weight:800;line-height:1}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.part{background:var(--blue-50);border-radius:12px;padding:12px}
.part b{display:block;color:var(--blue)}
.part span{font-size:13px;color:var(--ink-2)}
.rules{margin:10px 0 0;padding-left:20px;color:var(--ink-2)}
.rules li{margin:4px 0}

/* ---------- Form ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label.lb{font-weight:600;font-size:14px}
label.lb .req{color:var(--red)}
input[type=text],input[type=email],input[type=tel],select,textarea{font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.err{color:var(--red);font-size:13px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;user-select:none;font-size:14px;background:#fff}
.chip.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue);font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);background:var(--bg);padding:12px;border-radius:10px}
.consent input{margin-top:4px;width:18px;height:18px}

/* ---------- Device check ---------- */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.check{border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.check.ok{border-color:var(--green);background:#F1FBF5}
.check .st{font-weight:700;margin-top:10px}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .08s}

/* ---------- Test ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tab .cnt{font-size:12px;background:var(--bg);border-radius:99px;padding:1px 8px;color:var(--ink-3)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.tab.done .cnt{background:#E3F6EA;color:var(--green)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sec-head .pts{color:var(--blue);font-weight:700}
.task{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0;padding-top:0}
.task-title{font-weight:700;margin-bottom:12px}
.task-title small{font-weight:500;color:var(--ink-3)}

/* audio player */
.player{display:flex;align-items:center;gap:14px;background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.play-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.play-btn:disabled{background:#9DB5E8;cursor:not-allowed}
.prog{flex:1;height:8px;background:#fff;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--blue)}
.plays{font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.plays b{color:var(--blue)}

.dialog{background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dialog .no{font-weight:700;color:var(--blue);margin-bottom:6px}
.dialog p{margin:4px 0}
.blank{display:inline-flex;align-items:center;gap:6px;margin:2px 4px}
.blank .n{font-weight:700;color:var(--blue);font-size:14px}
.blank input{width:190px;padding:6px 10px;border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;max-width:520px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.tbl th{background:var(--blue-50);font-size:14px}
table.tbl input{width:100%;padding:6px 10px;border-radius:8px}

.q{padding:12px 0;border-bottom:1px solid #F0F2F7}
.q:last-child{border-bottom:0}
.q .stem{margin-bottom:8px}
.q .stem b{color:var(--blue);margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;background:#fff;font-size:15px;user-select:none}
.opt:hover{border-color:var(--blue-100);background:var(--blue-50)}
.opt.on{border-color:var(--blue);background:var(--blue);color:#fff}
.opt .k{font-weight:700;margin-right:6px}
.match{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:6px 0}
.match .w{font-weight:600}
.passage{background:var(--yellow-50);border-left:4px solid var(--yellow);border-radius:10px;padding:16px 18px;margin-bottom:14px;line-height:1.75}
.passage .g{display:inline-block;min-width:44px;text-align:center;font-weight:700;color:var(--blue);border-bottom:2px solid var(--blue);margin:0 3px}
.read-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.read-grid .passage{position:sticky;top:82px;max-height:calc(100vh - 110px);overflow:auto}
.verb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid #F0F2F7}
.verb input{width:200px;padding:6px 10px;border-radius:8px}
textarea.writing{min-height:260px;resize:vertical;line-height:1.7}
.wc{font-size:14px;color:var(--ink-3);text-align:right;margin-top:6px}
.nav-foot{display:flex;justify-content:space-between;margin-top:26px;gap:12px;flex-wrap:wrap}

/* ---------- Speaking ---------- */
.sp-wrap{max-width:760px;margin:0 auto}
.sp-steps{display:flex;gap:6px;margin:14px 0 22px}
.sp-steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.sp-steps i.done{background:var(--green)}
.sp-steps i.cur{background:var(--blue)}
.sp-card{text-align:center;padding:36px 28px}
.sp-text{font-size:30px;font-weight:700;line-height:1.35;margin:18px 0 26px;color:var(--ink)}
.sp-text.q{font-size:24px}
.rec-btn{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;margin:0 auto;box-shadow:0 8px 24px rgba(229,56,59,.35)}
.rec-btn.idle{background:var(--blue);box-shadow:0 8px 24px rgba(0,91,234,.3)}
.rec-btn:disabled{opacity:.45;cursor:not-allowed}
.rec-btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,56,59,.5)}70%{box-shadow:0 0 0 22px rgba(229,56,59,0)}100%{box-shadow:0 0 0 0 rgba(229,56,59,0)}}
.rec-info{margin-top:14px;font-weight:600;color:var(--ink-2);min-height:24px}
.rec-info .t{color:var(--red);font-variant-numeric:tabular-nums}
.listen-q{margin:6px auto 0}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,27,63,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:var(--r);padding:26px;max-width:480px;width:100%;box-shadow:var(--shadow)}
.modal h3{font-size:20px}

/* ---------- Done ---------- */
.done-ic{width:84px;height:84px;border-radius:50%;background:#E3F6EA;color:var(--green);display:grid;place-items:center;margin:0 auto 16px}
.spinner{width:42px;height:42px;border:4px solid var(--blue-100);border-top-color:var(--blue);border-radius:50%;animation:sp 0.9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:200;font-size:14px}
.demo-flag{background:var(--yellow);color:var(--ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}

@media (max-width:820px){
  .hero,.check-grid,.form-grid,.read-grid{grid-template-columns:1fr}
  .read-grid .passage{position:static;max-height:none}
  .parts{grid-template-columns:1fr 1fr}
  .match{grid-template-columns:1fr}
}
</style>
</head>

</header>

<main class="wrap" id="app"></main>
<div id="modalRoot"></div>

async function api(action, payload, tries=3){
  if (DEMO){ await sleep(400); return { ok:true, demo:true, mode:"PILOT" }; }
  let lastErr;
  for (let i=0;i<tries;i++){
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action, token:API_TOKEN, ...payload }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error||"Lỗi máy chủ");
      return j;
    }catch(e){ lastErr=e; await sleep(1200*(i+1)); }
  }
  throw lastErr;
}

async function ensureMic(){
  if (MIC) return MIC;
  const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 } });
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser(); analyser.fftSize = 1024; src.connect(analyser);
  MIC = { stream, ctx, src, analyser };
  meterLoop();
  return MIC;
}
function meterLoop(){
  if (!MIC) return;
  const a = new Uint8Array(MIC.analyser.fftSize);
  const tick = () => {
    if (!MIC) return;
    MIC.analyser.getByteTimeDomainData(a);
    let m=0; for (const v of a) m=Math.max(m,Math.abs(v-128));
    const pct = Math.min(100, m/128*220);
    document.querySelectorAll(".lv").forEach(el=>el.style.width=pct+"%");
    const lv=$("#micLv"); if (lv) lv.style.width=pct+"%";
    requestAnimationFrame(tick);
  }; tick();
}
async function testMic(){
  const st=$("#micSt"), b=$("#btnMic");
  try{ await ensureMic(); }catch(e){
    st.innerHTML = `<span style="color:var(--red)">Không mở được micro. Bấm biểu tượng 🔒 trên thanh địa chỉ → cho phép Micro, rồi tải lại trang.</span>`; return; }
  b.disabled = true; st.textContent = "Đang thu… hãy nói gì đó";

  };
}

/* ---------- WAV recorder (16 kHz mono – định dạng AI chấm tốt nhất) ---------- */
function startRecording(){
  const ctx = MIC.ctx; if (ctx.state==="suspended") ctx.resume();
  const proc = ctx.createScriptProcessor(4096,1,1);
  const chunks = []; let peak = 0;
  proc.onaudioprocess = e => { const d=e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); for (let i=0;i<d.length;i+=64) peak=Math.max(peak,Math.abs(d[i])); };
  MIC.src.connect(proc); proc.connect(ctx.destination);
  const t0 = Date.now();
  return { stop: async () => {
    proc.disconnect(); try{ MIC.src.disconnect(proc); }catch(e){}
    const len = chunks.reduce((s,c)=>s+c.length,0), all = new Float32Array(len); let o=0; for (const c of chunks){ all.set(c,o); o+=c.length; }
    const wav = encodeWav(downsample(all, ctx.sampleRate, 16000), 16000);
    return { blob:wav, url:URL.createObjectURL(wav), sec:(Date.now()-t0)/1000, peak };
  }};
}
function downsample(buf, from, to){
  if (to>=from) return buf;
  const ratio = from/to, n = Math.round(buf.length/ratio), out = new Float32Array(n);
  for (let i=0;i<n;i++){ const s=Math.floor(i*ratio), e=Math.min(buf.length,Math.floor((i+1)*ratio)); let sum=0; for (let j=s;j<e;j++) sum+=buf[j]; out[i]=sum/Math.max(1,e-s); }
  return out;
}
function encodeWav(samples, rate){
  const b = new ArrayBuffer(44+samples.length*2), v = new DataView(b);
  const w = (o,s)=>{ for (let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+samples.length*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,samples.length*2,true);
  let o=44; for (const s of samples){ const x=Math.max(-1,Math.min(1,s)); v.setInt16(o, x<0?x*0x8000:x*0x7FFF, true); o+=2; }
  return new Blob([v],{type:"audio/wav"});
}
const blobToB64 = blob => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result.split(",")[1]); fr.readAsDataURL(blob); });

/* ---------- Text-to-speech (đọc câu hỏi Speaking) ---------- */
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/Google US English/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang) && /Samantha|Aria|Jenny|Zira|Natural/i.test(v.name)) || vs.find(v=>/^en(-|_)US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang));
}
function speak(text){
  return new Promise(res=>{
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if (v) u.voice=v;
      u.lang="en-US"; u.rate=0.88; u.onend=res; u.onerror=res; speechSynthesis.speak(u);
      setTimeout(res, 15000);
    }catch(e){ res(); }
  });
}

    const id=b.dataset.au, left=MAX_PLAYS-(S.plays[id]||0);
    b.disabled = left<=0 || !!AUDIO.cur;
    const pc=$("#pc_"+id); if (pc) pc.innerHTML = AUDIO.cur===id ? `Đang phát… (lượt ${S.plays[id]}/${MAX_PLAYS})` : (left>0?`Còn <b>${left}</b>/${MAX_PLAYS} lượt nghe`:`Đã hết lượt nghe`);
  });
}
function playAudio(id){
  if (AUDIO.cur) return;
  if ((S.plays[id]||0) >= MAX_PLAYS) return;
  S.plays[id] = (S.plays[id]||0)+1; save();          // trừ lượt ngay khi bấm (tải lại trang không được cộng lại)
  const a = new Audio(AUDIO_FILES[id]); a.preload="auto";
  AUDIO = { el:a, cur:id };
  a.ontimeupdate = ()=>{ const p=$("#pg_"+id); if (p && a.duration) p.style.width=(a.currentTime/a.duration*100)+"%"; };
  a.onended = ()=>{ AUDIO={el:null,cur:null}; const p=$("#pg_"+id); if(p) p.style.width="100%"; refreshPlayers(); api("event",{sid:S.sid,ev:"play_"+id+"_"+S.plays[id]}).catch(()=>{}); };
  a.onerror = ()=>{ S.plays[id]--; save(); AUDIO={el:null,cur:null}; refreshPlayers(); toast("Không tải được audio. Kiểm tra mạng rồi bấm lại (không bị trừ lượt)."); };
  a.play().catch(()=>a.onerror());
  refreshPlayers();
}

/* --- Vocabulary --- */
function htmlVocab(){
  const V=TEST.vocab;
  let h = `<div class="task"><div class="task-title">Task 1. Match the words to their definitions. <small>(10 câu)</small></div>`;
  V.t1.words.forEach((w,i)=>{
    const k="vocab.t1."+(i+1);
    h += `<div class="match"><div class="w">${i+1}. ${w}</div><select data-k="${k}"><option value="">— chọn định nghĩa —</option>${V.t1.defs.map(d=>`<option value="${d[0]}" ${A(k)===d[0]?"selected":""}>${d[0]}. ${d[1]}</option>`).join("")}</select></div>`;
  });

  V.t2.forEach((q,i)=> h += `<div class="q"><div class="stem"><b>${i+1}.</b>${q.s}</div>${mcq("vocab.t2."+(i+1),q.o)}</div>`);

}
/* --- Grammar --- */
function htmlGrammar(){
  const G=TEST.grammar;
  let h = `<div class="task"><div class="task-title">Task 1. Choose the best answers. <small>(10 câu)</small></div>`;
  G.t1.forEach((q,i)=> h += `<div class="q"><div class="stem"><b>${i+1}.</b>${q.s}</div>${mcq("grammar.t1."+(i+1),q.o)}</div>`);
  h += `</div><div class="task"><div class="task-title">Task 2. Put the verbs in the correct form. <small>(5 câu)</small></div>`;
  G.t2.forEach((q,i)=> h += `<div class="verb"><b style="color:var(--blue)">${i+1}.</b> <span>${q.a}</span> ${inp("grammar.t2."+(i+1))} <span>${q.b}</span></div>`);
  return h+`</div>`;
}
/* --- Reading --- */
function htmlReading(){

/* --- Writing --- */
function htmlWriting(){
  return `<div class="task"><div class="passage" style="background:var(--blue-50);border-color:var(--blue)"><b>${TEST.writing.prompt}</b></div>
    <textarea class="writing" id="wr" data-k="writing" placeholder="Start writing here…" ${NOFIX}>${esc(A("writing")||"")}</textarea>
    <div class="wc" id="wc"></div>
    <p class="muted" style="font-size:13px">Lưu ý: để đánh giá đúng năng lực của bạn, phần viết đã tắt chức năng kiểm tra chính tả và không cho phép dán văn bản.</p></div>`;
}
function wordCount(t){ return (t.trim().match(/[A-Za-zÀ-ỹ0-9'’-]+/g)||[]).length; }
function bindWriting(){
  const t=$("#wr"), wc=$("#wc"); const up=()=>wc.textContent=wordCount(t.value)+" / ~150 từ"; up();
  t.addEventListener("input",up);
  t.addEventListener("paste",e=>{e.preventDefault();toast("Phần viết không hỗ trợ dán văn bản, bạn vui lòng tự gõ bài nhé.");});
  t.addEventListener("drop",e=>e.preventDefault());
}

/* --- Timer --- */
function startTimer(){
  clearInterval(timerInt);
  const speaking = S.phase==="speaking";
  const deadline = speaking ? S.spStartedAt + SPEAK_MINUTES*60000 : S.startedAt + WRITTEN_MINUTES*60000;
  $("#timer").title = speaking ? "Thời gian còn lại phần Speaking" : "Thời gian còn lại phần thi viết";
  const tick=()=>{
    const left = deadline - Date.now();
    if (left<=0){ clearInterval(timerInt); $("#timerTxt").textContent="00:00";
      if (speaking) return speakTimeUp();
      toast("Đã hết thời gian làm bài, hệ thống đang tự động nộp phần thi viết.",4000); submitWritten(true); return; }
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    $("#timerTxt").textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    $("#timer").classList.toggle("warn", left<(speaking?2:5)*60000);
  };
  tick(); timerInt=setInterval(tick,1000);
}
function confirmSubmitWritten(){
  const miss = SECTIONS.map(s=>{ const n=answeredCount(s.id); return n<s.total?`<li>${s.name}: còn ${s.total-n} câu chưa làm</li>`:""; }).join("");
  modal(`<h3>Nộp phần thi viết?</h3>
    ${miss?`<p>Bạn vẫn còn câu chưa trả lời:</p><ul>${miss}</ul>`:`<p>Bạn đã trả lời tất cả các câu.</p>`}
    <p class="muted">Sau khi nộp, bạn sẽ <b>không thể quay lại sửa</b> phần thi viết, đồng thời hệ thống chuyển sang phần Speaking.</p>
    <div class="row end" style="margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">Làm tiếp</button><button class="btn btn-primary" onclick="closeModal();submitWritten(false)">Nộp bài</button></div>`);
}
let submittingWritten=false;
async function submitWritten(auto){
  if (submittingWritten || S.phase!=="written") return; submittingWritten=true;
  clearInterval(timerInt); if (AUDIO.el){ AUDIO.el.pause(); AUDIO={el:null,cur:null}; }
  $("#app").innerHTML = `<div class="card narrow" style="text-align:center"><div class="spinner"></div><p style="margin-top:16px">Đang lưu bài làm…</p></div>`;
  const durationMin = Math.round((Date.now()-S.startedAt)/600)/100;
  try{ await api("written", { sid:S.sid, answers:S.answers, writing:S.answers.writing||"", durationMin, auto:!!auto, plays:S.plays }, 5); }
  catch(e){ submittingWritten=false; S.phase="written"; save(); modal(`<h3>Chưa lưu được bài</h3><p>Mất kết nối tới máy chủ. Bài làm vẫn được giữ trên máy này.</p><div class="row end"><button class="btn btn-primary" onclick="closeModal();submitWritten(${!!auto})">Thử lại</button></div>`); return; }
  S.writtenAt = Date.now(); S.phase="speakIntro";
  S.sp = { task:1, idx:0, done:{}, t2: buildT2() };
  save(); submittingWritten=false; render();
}

/* ======================================================================
   7. SPEAKING
   ====================================================================== */
function buildT2(){
  const pick = x => Array.isArray(x) ? x[Math.floor(Math.random()*x.length)] : x;
  const intro = TEST.speaking.intro.map(pick);
  const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
  const qs = [ ...shuffle(intro).slice(0,3).map(q=>({topic:"Introduce yourself & Habits", q})) ];
  shuffle(Object.keys(TEST.speaking.topics)).slice(0,2).forEach(t=>{
    TEST.speaking.topics[t].slice(0,2).forEach(q=>qs.push({topic:t,q}));
  });
  return qs;
}
function renderSpeakIntro(){
  $("#app").innerHTML = `
  <div class="card narrow">
    <span class="pill">Section 6 · SPEAKING (20 points)</span>
    <h2 style="margin-top:12px">Phần thi Nói</h2>
    <p class="lead">Phần thi viết của bạn đã được lưu. Tiếp theo là <b>${SPEAK_MINUTES} phút Speaking</b> gồm 2 task, và bạn sẽ ghi âm trực tiếp trên máy. Đồng hồ ${SPEAK_MINUTES} phút bắt đầu chạy khi bạn bấm "Bắt đầu Speaking".</p>
    <div class="check-grid">
      <div class="check"><h3>Task 1 · Đọc to (10 điểm)</h3><p class="muted" style="margin:0">Bạn lần lượt đọc to 10 từ và câu hiện trên màn hình. Với mỗi mục, bạn bấm nút ghi âm, đọc thật rõ ràng rồi bấm dừng (tối đa ${T1_MAX_SEC} giây).</p></div>
      <div class="check"><h3>Task 2 · Trả lời câu hỏi (10 điểm)</h3><p class="muted" style="margin:0">Bạn sẽ nghe ${S.sp.t2.length} câu hỏi về bản thân và 2 chủ đề ngẫu nhiên. Bạn hãy cố gắng trả lời thành câu hoàn chỉnh, thêm lý do hoặc ví dụ nếu có thể (tối đa ${T2_MAX_SEC} giây mỗi câu).</p></div>
    </div>
    <p class="muted" style="margin-top:16px">Để bản ghi rõ nhất, bạn nên ngồi gần micro và nói to, rõ ràng. Lưu ý rằng mỗi mục chỉ được ghi âm <b>1 lần</b>.</p>
    <div class="row end" style="margin-top:16px"><button class="btn btn-primary btn-lg" onclick="beginSpeaking()">Bắt đầu Speaking →</button></div>
  </div>`;
}
async function beginSpeaking(){
  try{ await ensureMic(); }catch(e){ return toast("Chưa mở được micro – hãy cho phép quyền Micro trên trình duyệt.",4000); }
  if (!S.spStartedAt) S.spStartedAt = Date.now();
  S.phase="speaking"; save(); render();
}
function speakTimeUp(){
  if (S.phase!=="speaking") return;
  S.spTimeUp = true; save();
  toast("Đã hết 10 phút Speaking, hệ thống đang tự động nộp bài.",4000);
  if (REC && !stopping) return toggleRec(CUR_KEY);   // đang ghi âm → dừng, lưu bản ghi rồi nộp
  if (!stopping){ S.phase="finishing"; save(); render(); }
}
let REC = null, recTimer = null, qPlays = 0, stopping = false, CUR_KEY = "";
function renderSpeaking(){
  const sp=S.sp, isT1 = sp.task===1;
  const list = isT1 ? TEST.speaking.t1 : sp.t2;
  const total = list.length, i = sp.idx;
  const item = list[i];
  const key = (isT1?"t1_":"t2_") + String(i+1).padStart(2,"0");
  CUR_KEY = key; qPlays = 0;
  if (!timerInt || $("#timer").title.indexOf("Speaking")<0) startTimer();
  $("#app").innerHTML = `
  <div class="sp-wrap">
    <div class="row"><b>Speaking · Task ${sp.task}</b><span class="muted">— ${isT1?"Read these words and sentences":"Answer the following questions"}</span><div class="spacer"></div><span class="muted">${i+1} / ${total}</span></div>
    <div class="sp-steps">${list.map((_,j)=>`<i class="${j<i?"done":j===i?"cur":""}"></i>`).join("")}</div>
    <div class="card sp-card">
      ${isT1
        ? `<div class="muted">Đọc to:</div><div class="sp-text">${esc(item)}</div>`
        : `<div class="muted">Chủ đề: <b>${esc(item.topic)}</b></div>
           <button class="btn btn-ghost listen-q" id="btnQ" onclick="playQ()" style="margin-top:14px">🔊 Nghe câu hỏi <span id="qLeft">(còn 2 lượt)</span></button>
           <div class="sp-text q" id="qText">${esc(item.q)}</div>`}
      <button class="rec-btn idle" id="recBtn" onclick="toggleRec('${key}')" title="Ghi âm">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
      </button>
      <div class="meter" style="max-width:280px;margin:16px auto 0"><i class="lv"></i></div>
      <div class="rec-info" id="recInfo">Bấm nút để bắt đầu ${isT1?"đọc":"trả lời"}</div>
    </div>
  </div>`;
  if (!isT1) setTimeout(playQ, 500);
}
async function playQ(){
  if (qPlays>=2 || REC) return;
  qPlays++; const b=$("#btnQ"); b.disabled=true;
  await speak(S.sp.t2[S.sp.idx].q);
  const l=$("#qLeft"); if (l) l.textContent = qPlays>=2?"(hết lượt)":`(còn ${2-qPlays} lượt)`;
  if (b) b.disabled = qPlays>=2;
}
async function toggleRec(key){
  const btn=$("#recBtn"), info=$("#recInfo");
  if (!REC){
    speechSynthesis.cancel(); const bq=$("#btnQ"); if (bq) bq.disabled=true;
    REC = startRecording(); const t0=Date.now(), max = S.sp.task===1?T1_MAX_SEC:T2_MAX_SEC;
    btn.classList.remove("idle"); btn.classList.add("pulse");
    btn.innerHTML = `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
    const tick=()=>{ const s=Math.floor((Date.now()-t0)/1000); info.innerHTML=`Đang ghi âm <span class="t">${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}</span> / ${max}s — bấm để dừng`; if (s>=max) toggleRec(key); };
    tick(); recTimer=setInterval(tick,250);
    return;
  }
  if (stopping) return; stopping = true;
  clearInterval(recTimer); btn.disabled=true;
  const r = await REC.stop(); REC=null;
  btn.classList.remove("pulse"); info.textContent="Đang lưu bản ghi…";
  const b64 = await blobToB64(r.blob);
  const meta = { sec:Math.round(r.sec*10)/10, silent: r.peak<0.02 };
  const isT1 = S.sp.task===1;
  const prompt = isT1 ? TEST.speaking.t1[S.sp.idx] : S.sp.t2[S.sp.idx].q;
  try{ await api("audio", { sid:S.sid, key, b64, prompt, meta }, 4); S.sp.done[key]=1; }
  catch(e){ S.pending[key] = { b64, prompt, meta }; S.sp.done[key]=2; toast("Mạng chập chờn – bản ghi được giữ lại và gửi lại khi nộp bài."); }
  save(); stopping = false;
  nextSpeak();
}
function nextSpeak(){
  const sp=S.sp, len = sp.task===1 ? TEST.speaking.t1.length : sp.t2.length;
  if (S.spTimeUp){ clearInterval(timerInt); S.phase="finishing"; save(); return render(); }
  if (sp.idx < len-1){ sp.idx++; save(); return renderSpeaking(); }
  if (sp.task===1){ sp.task=2; sp.idx=0; save();
    $("#app").innerHTML = `<div class="card narrow" style="text-align:center"><h2>Bạn đã hoàn thành Task 1</h2><p class="lead">Tiếp theo là Task 2, phần trả lời câu hỏi. Hệ thống sẽ đọc từng câu hỏi (bạn được nghe tối đa 2 lần), đồng thời câu hỏi cũng hiển thị trên màn hình để bạn tiện theo dõi.</p><button class="btn btn-primary btn-lg" onclick="renderSpeaking()">Bắt đầu Task 2 →</button></div>`;
    return; }
  S.phase="finishing"; save(); render();
}
async function renderFinishing(){
  clearInterval(timerInt);
  $("#app").innerHTML = `<div class="card narrow" style="text-align:center"><div class="spinner"></div><h2 style="margin-top:16px">Đang nộp bài…</h2><p class="muted">Vui lòng không đóng trang.</p></div>`;
  try{
    for (const k of Object.keys(S.pending||{})){ const p=S.pending[k]; await api("audio",{ sid:S.sid, key:k, b64:p.b64, prompt:p.prompt, meta:p.meta },4); delete S.pending[k]; save(); }
    const r = await api("finish", { sid:S.sid, t2:S.sp.t2, done:S.sp.done }, 5);
    S.mode = r.mode || "LIVE"; S.phase="done"; save(); render();
  }catch(e){
    $("#app").innerHTML = `<div class="card narrow" style="text-align:center"><h2>Chưa nộp được bài</h2><p>Kết nối mạng đang có vấn đề. Bài làm vẫn được lưu trên máy này.</p><button class="btn btn-primary" onclick="render()">Thử nộp lại</button></div>`;
  }
}
function renderDone(){
  const pilot = S.mode==="PILOT";
  if (MIC){ MIC.stream.getTracks().forEach(t=>t.stop()); MIC=null; }
  $("#app").innerHTML = `
  <div class="card narrow" style="text-align:center;padding:40px 28px">
    <div class="done-ic"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1>Cảm ơn ${esc((S.info.name||"bạn").split(" ").slice(-1)[0])}, bạn đã hoàn thành bài kiểm tra!</h1>
    <p class="lead">${pilot
      ? "Bài làm của bạn đã được Vingo ghi nhận. Đội ngũ Học thuật sẽ gửi kết quả cùng nhận xét chi tiết tới bạn trong thời gian sớm nhất."
      : `Trong khoảng <b>10–15 phút</b> tới, kết quả bài kiểm tra cùng nhận xét chi tiết và lớp học phù hợp sẽ được gửi tới email <b>${esc(S.info.email)}</b>. Nếu chưa thấy email, bạn nhớ kiểm tra thêm hộp thư Spam hoặc Quảng cáo nhé.`}</p>
    <p class="muted">Bên cạnh đó, tư vấn viên ${esc(S.info.sale||"")} sẽ trao đổi trực tiếp với bạn về kết quả và lộ trình học ở bước tiếp theo.</p>
    <div class="row" style="justify-content:center;margin-top:26px"><button class="btn btn-ghost" onclick="newTest()">Bài kiểm tra mới (dành cho tư vấn viên)</button></div>
  </div>`;
}
function newTest(){
  modal(`<h3>Bắt đầu bài mới?</h3><p>Dữ liệu bài vừa làm đã được gửi lên hệ thống. Thao tác này xoá bài cũ khỏi máy để thí sinh tiếp theo làm bài.</p>
  <div class="row end"><button class="btn btn-ghost" onclick="closeModal()">Huỷ</button><button class="btn btn-primary" onclick="closeModal();clearAll();render()">Bắt đầu bài mới</button></div>`);
}

/* ---------- Modal / nav ---------- */
function modal(html){ $("#modalRoot").innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`; }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function go(ph){ S.phase=ph; save(); render(); window.scrollTo(0,0); }

/* ---------- Boot ---------- */
(function boot(){
  if (!S) S = blank();
  // Đang làm dở → hỏi tư vấn viên tiếp tục hay làm mới
  if (S.sid && !["welcome","form","done"].includes(S.phase)){
    render();
    if (S.phase==="written" || S.phase==="speaking" || S.phase==="speakIntro"){
      modal(`<h3>Có bài đang làm dở</h3><p>Thí sinh <b>${esc(S.info.name||"")}</b> đang làm dở bài kiểm tra trên máy này.</p>
        <div class="row end"><button class="btn btn-ghost" onclick="closeModal();clearAll();render()">Xoá & làm bài mới</button><button class="btn btn-primary" onclick="closeModal();resumeFix()">Tiếp tục bài này</button></div>`);
    }
    return;
  }
  render();
})();
function resumeFix(){ if (S.phase==="speaking"){ ensureMic().then(()=>render()).catch(()=>{S.phase="speakIntro";render();}); } else render(); }
window.addEventListener("beforeunload", e=>{ if (["written","speaking","finishing"].includes(S.phase)){ e.preventDefault(); e.returnValue=""; } });
</script>
